<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diagram-js Focus Feature Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #1a1a1a;
    }

    #canvas {
      width: 100%;
      height: 100%;
    }

    /* Spotlight overlay */
    .spotlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .spotlight-overlay.active {
      opacity: 1;
    }

    /* Info panel */
    .info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      max-width: 320px;
      backdrop-filter: blur(10px);
    }

    .info-panel h2 {
      margin: 0 0 15px 0;
      font-size: 20px;
      color: #333;
    }

    .info-panel p {
      margin: 10px 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #106ebe;
      transform: translateY(-1px);
    }

    .shortcuts {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .shortcuts h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #333;
    }

    .shortcut {
      display: flex;
      align-items: center;
      margin: 5px 0;
      font-size: 13px;
      color: #666;
    }

    .key {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      margin-right: 8px;
      min-width: 20px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* Status indicator */
    .status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .status.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="container">
    <svg id="canvas" viewBox="0 0 1200 600">
      <!-- Background grid -->
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="#1a1a1a"/>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      
      <!-- Diagram elements -->
      <g id="elements">
        <!-- GitHub -->
        <g class="element" data-id="github" transform="translate(80, 120)">
          <rect width="160" height="60" rx="8" fill="#111827" stroke="#333" stroke-width="2"/>
          <text x="80" y="35" text-anchor="middle" fill="white" font-size="16">GitHub</text>
        </g>
        
        <!-- Docker -->
        <g class="element" data-id="docker" transform="translate(320, 120)">
          <rect width="180" height="60" rx="8" fill="#0ea5e9" stroke="#333" stroke-width="2"/>
          <text x="90" y="35" text-anchor="middle" fill="white" font-size="16">Docker Build</text>
        </g>
        
        <!-- ECR -->
        <g class="element" data-id="ecr" transform="translate(580, 120)">
          <rect width="180" height="60" rx="8" fill="#10b981" stroke="#333" stroke-width="2"/>
          <text x="90" y="35" text-anchor="middle" fill="white" font-size="16">Amazon ECR</text>
        </g>
        
        <!-- Task Definition -->
        <g class="element" data-id="taskdef" transform="translate(840, 120)">
          <rect width="200" height="60" rx="8" fill="#8b5cf6" stroke="#333" stroke-width="2"/>
          <text x="100" y="35" text-anchor="middle" fill="white" font-size="16">Task Definition</text>
        </g>
        
        <!-- Connections -->
        <g id="connections" opacity="0.6">
          <path d="M 240 150 L 320 150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
          <path d="M 500 150 L 580 150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
          <path d="M 760 150 L 840 150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        </g>
        
        <!-- Arrow marker -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
          </marker>
        </defs>
      </g>
    </svg>
    
    <!-- Spotlight overlay -->
    <div class="spotlight-overlay" id="spotlight">
      <svg width="100%" height="100%" style="position: absolute;">
        <defs>
          <mask id="spotlight-mask">
            <rect width="100%" height="100%" fill="white"/>
            <circle id="spotlight-circle" cx="0" cy="0" r="0" fill="black"/>
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(2, 6, 23, 0.7)" mask="url(#spotlight-mask)"/>
      </svg>
    </div>
    
    <div class="info-panel">
      <h2>Focus Feature Demo</h2>
      <p>This demonstrates the focus/spotlight functionality for diagram-js. Click on elements to focus on them with smooth animations.</p>
      
      <div class="controls">
        <button class="btn" onclick="focusElement('github')">Focus GitHub</button>
        <button class="btn" onclick="fitAll()">Fit All</button>
      </div>
      
      <div class="shortcuts">
        <h3>Keyboard Shortcuts</h3>
        <div class="shortcut"><span class="key">Click</span> Focus element</div>
        <div class="shortcut"><span class="key">ESC</span> Clear focus</div>
        <div class="shortcut"><span class="key">F</span> Fit all elements</div>
        <div class="shortcut"><span class="key">←→</span> Navigate between elements</div>
      </div>
    </div>
    
    <div class="status" id="status"></div>
  </div>

  <script>
    // Focus state
    let currentFocus = null;
    let animationId = null;
    const svg = document.getElementById('canvas');
    const spotlight = document.getElementById('spotlight');
    const spotlightCircle = document.getElementById('spotlight-circle');
    const status = document.getElementById('status');
    
    // Element data
    const elements = [
      { id: 'github', x: 160, y: 150, width: 160, height: 60 },
      { id: 'docker', x: 410, y: 150, width: 180, height: 60 },
      { id: 'ecr', x: 670, y: 150, width: 180, height: 60 },
      { id: 'taskdef', x: 940, y: 150, width: 200, height: 60 }
    ];
    
    // Initialize viewBox
    let viewBox = { x: 0, y: 0, width: 1200, height: 600 };
    
    // Easing function
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    
    // Animate viewBox
    function animateViewBox(target, duration = 700) {
      const start = { ...viewBox };
      const startTime = Date.now();
      
      if (animationId) cancelAnimationFrame(animationId);
      
      function animate() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(progress);
        
        viewBox.x = start.x + (target.x - start.x) * eased;
        viewBox.y = start.y + (target.y - start.y) * eased;
        viewBox.width = start.width + (target.width - start.width) * eased;
        viewBox.height = start.height + (target.height - start.height) * eased;
        
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.width} ${viewBox.height}`);
        updateSpotlight();
        
        if (progress < 1) {
          animationId = requestAnimationFrame(animate);
        }
      }
      
      animate();
    }
    
    // Focus on element
    function focusElement(elementId) {
      const element = elements.find(e => e.id === elementId);
      if (!element) return;
      
      currentFocus = element;
      
      const padding = 100;
      const targetViewBox = {
        x: element.x - element.width - padding,
        y: element.y - element.height - padding,
        width: element.width * 3 + padding * 2,
        height: element.height * 3 + padding * 2
      };
      
      animateViewBox(targetViewBox);
      spotlight.classList.add('active');
      
      showStatus(`Focused on ${elementId}`);
    }
    
    // Fit all elements
    function fitAll() {
      currentFocus = null;
      spotlight.classList.remove('active');
      
      animateViewBox({ x: 0, y: 0, width: 1200, height: 600 });
      showStatus('Showing all elements');
    }
    
    // Update spotlight position
    function updateSpotlight() {
      if (!currentFocus) return;
      
      const scaleX = svg.clientWidth / viewBox.width;
      const scaleY = svg.clientHeight / viewBox.height;
      const scale = Math.min(scaleX, scaleY);
      
      const centerX = (currentFocus.x - viewBox.x) * scale;
      const centerY = (currentFocus.y - viewBox.y) * scale;
      
      const radius = Math.max(160, Math.hypot(currentFocus.width, currentFocus.height) * scale * 0.8);
      
      spotlightCircle.setAttribute('cx', centerX);
      spotlightCircle.setAttribute('cy', centerY);
      spotlightCircle.setAttribute('r', radius);
    }
    
    // Show status message
    function showStatus(message) {
      status.textContent = message;
      status.classList.add('visible');
      setTimeout(() => status.classList.remove('visible'), 2000);
    }
    
    // Handle element clicks
    document.querySelectorAll('.element').forEach(element => {
      element.style.cursor = 'pointer';
      element.addEventListener('click', () => {
        const id = element.getAttribute('data-id');
        if (currentFocus && currentFocus.id === id) {
          fitAll();
        } else {
          focusElement(id);
        }
      });
    });
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fitAll();
      } else if (e.key.toLowerCase() === 'f') {
        fitAll();
      } else if (currentFocus && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        const currentIndex = elements.findIndex(el => el.id === currentFocus.id);
        let nextIndex;
        
        if (e.key === 'ArrowLeft') {
          nextIndex = currentIndex > 0 ? currentIndex - 1 : elements.length - 1;
        } else {
          nextIndex = currentIndex < elements.length - 1 ? currentIndex + 1 : 0;
        }
        
        focusElement(elements[nextIndex].id);
      }
    });
    
    // Handle window resize
    window.addEventListener('resize', updateSpotlight);
  </script>
</body>
</html>
