<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diagram-js Focus Feature Example</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #canvas {
      width: 100%;
      height: 100vh;
      background: #f4f4f4;
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 300px;
    }

    .info h2 {
      margin-top: 0;
      color: #333;
    }

    .info ul {
      margin: 10px 0;
      padding-left: 20px;
    }

    .info li {
      margin: 5px 0;
      color: #666;
    }

    .info code {
      background: #f0f0f0;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 13px;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .controls button {
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .controls button:hover {
      background: #106ebe;
    }

    /* Custom styles for focus feature */
    .djs-focus-spotlight {
      z-index: 1000;
    }

    .djs-element.focused {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  
  <div class="info">
    <h2>Focus Feature Demo</h2>
    <p>This example demonstrates the focus/spotlight feature for diagram-js.</p>
    
    <h3>Interactions:</h3>
    <ul>
      <li><strong>Click</strong> on any shape to focus</li>
      <li><strong>Click</strong> again to unfocus</li>
      <li><strong>Double-click</strong> canvas to fit all</li>
      <li>Press <code>F</code> to fit all</li>
      <li>Press <code>ESC</code> to blur focus</li>
      <li>Use <code>Arrow Keys</code> to navigate between shapes</li>
    </ul>

    <div class="controls">
      <button id="focusFirstBtn">Focus First Shape</button>
      <button id="fitAllBtn">Fit All</button>
    </div>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
